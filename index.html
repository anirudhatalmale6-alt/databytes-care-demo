<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPTC Passenger Care — demonstration</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Passenger care and complaints handling — working demonstration prepared by DataBytes Consulting.">
<link rel="stylesheet" href="assets/app.css?v=4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230d1826'/%3E%3Crect x='7' y='9' width='18' height='12' rx='2.5' fill='%23f0a828'/%3E%3Ccircle cx='11.5' cy='22' r='2' fill='%238ba0b6'/%3E%3Ccircle cx='20.5' cy='22' r='2' fill='%238ba0b6'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <aside class="rail">
    <div class="brand">
      <b>Passenger Care</b>
      <span>SPTC · Mahé</span>
    </div>

    <nav class="nav">
      <div class="lbl">Desk</div>
      <a href="#/dashboard">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="8" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        Control desk
      </a>
      <a href="#/queue">
        <svg class="ico" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
        Case queue <span class="ct" id="ctQueue">0</span>
      </a>
      <a href="#/routes">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 20V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v13"/><line x1="5" y1="15" x2="19" y2="15"/><circle cx="8.5" cy="18" r="1.2"/><circle cx="15.5" cy="18" r="1.2"/></svg>
        By route
      </a>

      <div class="lbl">Intake</div>
      <a href="#/new">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Log a case <span class="ct" id="ctNew">0</span>
      </a>
    </nav>

    <div class="railfoot">
      <button id="resetBtn">Reset the demonstration</button>
      <div style="margin-top:9px;line-height:1.45">
        Prepared by DataBytes Consulting.<br>Sample data — not SPTC records.
      </div>
    </div>
  </aside>

  <div>
    <header class="top">
      <div>
        <h1 id="ph">Control desk</h1>
        <div class="sub" id="ps">Passenger contact across the network</div>
      </div>

      <span class="spacer"></span>

      <div class="live"><span class="dot"></span><span class="mono" id="clock">--:--:--</span></div>

      <div class="seg" id="roleSeg" title="The same system, seen by two different jobs">
        <button data-role="agent">Agent</button>
        <button data-role="sup">Supervisor</button>
      </div>

      <button class="iconbtn" id="themeBtn" title="Light or dark">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="6.9" y2="6.9"/><line x1="17.1" y1="17.1" x2="18.8" y2="18.8"/><line x1="5.2" y1="18.8" x2="6.9" y2="17.1"/><line x1="17.1" y1="6.9" x2="18.8" y2="5.2"/></svg>
      </button>

      <div class="who">
        <span class="av" id="whoAv">BE</span>
        <div>
          <div class="nm" id="whoName">Bernard Esparon</div>
          <div class="tt" id="whoTitle">Head of Customer Care</div>
        </div>
      </div>
    </header>

    <main>
      <div id="view"></div>
    </main>
  </div>

</div>

<script src="assets/data.js?v=4"></script>
<script src="assets/app.js?v=4"></script>
</body>
</html>
